name: CI and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_XWIN_VERSION: 0.22.0
  DEVKITARM_IMAGE: devkitpro/devkitarm:20260221@sha256:4debd5b33cf4361a557b6bf3be5ff823804868125ce1429912f1a4e773e7ac5d

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' actionlint.tar.gz | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - run: ./actionlint

  checks:
    name: Deterministic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            pc -> target
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: make test
      - name: Check release helper syntax
        run: bash -n scripts/*.sh

  nds-rom:
    name: Build release ROM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [workflow-lint, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make nds-dist DEVKITARM_IMAGE="$DEVKITARM_IMAGE" PC_IP=192.0.2.1 PC_PORT=26760
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ds-controller-nds
          path: dist/nds
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build, sign, and publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [workflow-lint, checks, nds-rom]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ds-controller-nds
          path: dist/nds
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            pc -> target
      - name: Install release build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev lld llvm minisign nsis p7zip-full patchelf zip
          command -v cargo-xwin >/dev/null || cargo install cargo-xwin --locked --version "$CARGO_XWIN_VERSION"
      - name: Compute release identity and preflight
        id: release
        env:
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          version="$(date -u -d "$created_at" '+%Y.%-m.%-d')-${GITHUB_RUN_NUMBER}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          bash scripts/preflight-release.sh "$version" "$TARGET_SHA"
      - name: Generate release configuration
        if: steps.release.outputs.skip_mutation != 'true'
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          source = pathlib.Path("pc/app/src-tauri/tauri.release.conf.json")
          config = json.loads(source.read_text())
          config["version"] = os.environ["VERSION"]
          pathlib.Path("pc/app/src-tauri/tauri.release.generated.json").write_text(json.dumps(config))
          PY
        env:
          VERSION: ${{ steps.release.outputs.version }}
      - name: Build and upload signed Debian updater
        if: steps.release.outputs.skip_mutation != 'true'
        id: deb
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: pc/app
          tauriScript: pnpm tauri
          args: --bundles deb --config src-tauri/tauri.release.generated.json
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: DS Controller ${{ steps.release.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadPlainBinary: false
      - name: Build and upload signed current-user NSIS updater
        if: steps.release.outputs.skip_mutation != 'true'
        id: nsis
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.deb.outputs.releaseId }}
          projectPath: pc/app
          tauriScript: pnpm tauri
          args: --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.release.generated.json
          tagName: ${{ steps.release.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          uploadPlainBinary: false
      - name: Verify action-reported application versions
        if: steps.release.outputs.skip_mutation != 'true'
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          DEB_VERSION: ${{ steps.deb.outputs.appVersion }}
          NSIS_VERSION: ${{ steps.nsis.outputs.appVersion }}
        run: test "$DEB_VERSION" = "$EXPECTED_VERSION" && test "$NSIS_VERSION" = "$EXPECTED_VERSION"
      - name: Create and upload convenience bundles
        if: steps.release.outputs.skip_mutation != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf release-assets release-bundle
          mkdir -p release-assets release-bundle/ds-controller-windows release-bundle/ds-controller-ubuntu
          gh release download "$TAG" --dir release-assets
          mapfile -t debs < <(find release-assets -maxdepth 1 -type f -name '*.deb')
          mapfile -t exes < <(find release-assets -maxdepth 1 -type f -name '*.exe')
          test "${#debs[@]}" -eq 1 && test "${#exes[@]}" -eq 1
          bash scripts/verify-linux-deb.sh "${debs[0]}" "$VERSION"
          7z l "${exes[0]}" | grep -F 'ds-controller.exe'
          cp "${exes[0]}" dist/nds/ds-controller.nds dist/nds/ds-controller.ini release-bundle/ds-controller-windows/
          cp "${debs[0]}" dist/nds/ds-controller.nds dist/nds/ds-controller.ini release-bundle/ds-controller-ubuntu/
          (cd release-bundle && zip -X -q -r "../release-assets/ds-controller-windows-$TAG.zip" ds-controller-windows)
          (cd release-bundle && zip -X -q -r "../release-assets/ds-controller-ubuntu-$TAG.zip" ds-controller-ubuntu)
          gh release upload "$TAG" release-assets/ds-controller-*.zip --clobber
      - name: Validate draft and promote automatically
        if: steps.release.outputs.skip_mutation != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf release-assets/final
          mkdir -p release-assets/final
          gh release download "$TAG" --dir release-assets/final
          bash scripts/preflight-release.sh "$VERSION" "$TARGET_SHA" >/dev/null
          public_key=$(python3 -c 'import json; print(json.load(open("pc/app/src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"])')
          bash scripts/finalize-release.sh release-assets/final "$VERSION" "$TAG" "$TARGET_SHA" "$public_key"
          gh release upload "$TAG" release-assets/final/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --prerelease=false --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
      - name: Verify already-published rerun without mutation
        if: steps.release.outputs.skip_mutation == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
          VERIFY_ONLY: "true"
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets
          public_key=$(python3 -c 'import json; print(json.load(open("pc/app/src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"])')
          bash scripts/finalize-release.sh release-assets "$VERSION" "$TAG" "$TARGET_SHA" "$public_key"
