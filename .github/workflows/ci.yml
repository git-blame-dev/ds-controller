name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - demo.webp
      - docs/**
  pull_request:
    paths-ignore:
      - .gitignore
      - README.md
      - demo.webp
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_XWIN_VERSION: 0.22.0
  LINUX_PACKAGE_VERSION: 0.1.${{ github.run_number }}

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint

      - name: Run actionlint
        run: ./actionlint

  linux-build-test-package:
    name: Linux build, test, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            lld \
            llvm \
            patchelf \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
          workspaces: |
            . -> target
            pc -> target

      - name: Cache cargo-xwin
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-${{ env.CARGO_XWIN_VERSION }}

      - name: Install cargo-xwin
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          command -v cargo-xwin >/dev/null || cargo install cargo-xwin --locked --version "${CARGO_XWIN_VERSION}"
          cargo-xwin --version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run deterministic tests
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: make test

      - name: Run package prerequisite tests
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: make test-ci-package-prereqs

      - name: Build, stage, and verify Ubuntu release package
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: make linux-verify

      - name: Upload Ubuntu app package
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: ds-controller-linux-deb
          path: dist/linux
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Build and stage Windows release files
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: make pc-dist

      - name: Upload Windows portable app
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: ds-controller-pc-app
          path: dist/pc
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  nds-rom-build:
    name: NDS ROM build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      DEVKITARM_IMAGE: devkitpro/devkitarm:20260221@sha256:4debd5b33cf4361a557b6bf3be5ff823804868125ce1429912f1a4e773e7ac5d

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and stage NDS release files
        run: make nds-dist DEVKITARM_IMAGE="$DEVKITARM_IMAGE" PC_IP=192.0.2.1 PC_PORT=26760

      - name: Upload NDS release files
        uses: actions/upload-artifact@v7
        with:
          name: ds-controller-nds
          path: dist/nds
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
