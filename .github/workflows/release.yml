name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate calendar version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          date_part="$(date -u +'%Y.%m.%d')"
          next_daily_number=1

          while IFS= read -r tag; do
            suffix="${tag##*.}"
            case "$suffix" in
              ''|*[!0-9]*)
                continue
                ;;
            esac

            suffix_number=$((10#$suffix))
            if [ "$suffix_number" -ge "$next_daily_number" ]; then
              next_daily_number=$((suffix_number + 1))
            fi
          done <<EOF
          $(git tag --list "v${date_part}.*")
          EOF

          version="v${date_part}.${next_daily_number}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Determine release scope
        id: release_scope
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --force

          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${TARGET_SHA}^" 2>/dev/null || true)"
          printf 'previous_tag=%s\n' "$previous_tag" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            tag_target="$(git rev-list -n 1 "$VERSION")"
            if [ "$tag_target" != "$TARGET_SHA" ]; then
              printf 'Refusing to publish %s because tag %s already points at %s.\n' "$TARGET_SHA" "$VERSION" "$tag_target" >&2
              exit 1
            fi
          fi

          existing_release_tags="$(git tag --points-at "$TARGET_SHA" --list 'v[0-9]*' || true)"
          if [ -z "$existing_release_tags" ]; then
            existing_release_tags="$(gh api "repos/${REPOSITORY}/releases" --paginate --jq ".[] | select(.target_commitish == \"${TARGET_SHA}\") | .tag_name" | head -n 1)"
          fi

          if [ -n "$existing_release_tags" ]; then
            while IFS= read -r existing_tag; do
              [ -n "$existing_tag" ] || continue

              release_assets="$(gh release view "$existing_tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
              current_assets_complete=true
              legacy_assets_complete=true

              for required_asset in "ds-controller-windows-${existing_tag}.zip" "ds-controller-ubuntu-${existing_tag}.zip" 'SHA256SUMS'; do
                if ! printf '%s\n' "$release_assets" | grep -Fxq "$required_asset"; then
                  current_assets_complete=false
                fi
              done

              for required_asset in "ds-controller-${existing_tag}.zip" 'ds-controller-linux-amd64.deb' 'SHA256SUMS'; do
                if ! printf '%s\n' "$release_assets" | grep -Fxq "$required_asset"; then
                  legacy_assets_complete=false
                fi
              done

              if [ "$current_assets_complete" != true ] && [ "$legacy_assets_complete" != true ]; then
                printf 'Existing release %s is incomplete for both supported asset layouts.\n' "$existing_tag" >&2
                printf 'Refusing to create a second release for %s while %s is incomplete.\n' "$TARGET_SHA" "$existing_tag" >&2
                exit 1
              fi

              printf 'Release %s already targets %s; skipping duplicate release.\n' "$existing_tag" "$TARGET_SHA"
              printf 'should_publish=false\n' >> "$GITHUB_OUTPUT"
              printf 'skip_reason=%s\n' "release ${existing_tag} already targets this commit" >> "$GITHUB_OUTPUT"
              exit 0
            done <<EOF
          $existing_release_tags
          EOF
          fi

          if [ -z "$previous_tag" ]; then
            printf 'should_publish=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${previous_tag}..${TARGET_SHA}")"
          has_release_artifact_input_change=false

          while IFS= read -r path; do
            [ -n "$path" ] || continue

            case "$path" in
              .github/workflows/release.yml|Makefile|nds/*|pc/*|Cargo.toml|Cargo.lock|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                has_release_artifact_input_change=true
                ;;
            esac
          done <<EOF
          $changed_files
          EOF

          printf 'Changed files since %s:\n%s\n' "$previous_tag" "$changed_files"
          printf 'should_publish=%s\n' "$has_release_artifact_input_change" >> "$GITHUB_OUTPUT"
          if [ "$has_release_artifact_input_change" != true ]; then
            printf 'skip_reason=%s\n' 'no release artifact inputs changed' >> "$GITHUB_OUTPUT"
          fi

      - name: Skip release
        if: steps.release_scope.outputs.should_publish != 'true'
        run: |
          printf 'Skipping release: %s.\n' "${{ steps.release_scope.outputs.skip_reason }}"

      - name: Confirm main still targets released commit
        if: steps.release_scope.outputs.should_publish == 'true'
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          current_main="$(git rev-parse FETCH_HEAD)"

          if [ "$current_main" != "$TARGET_SHA" ]; then
            printf 'Refusing to publish %s because origin/main is now %s.\n' "$TARGET_SHA" "$current_main" >&2
            exit 1
          fi

      - name: Download Windows app artifact from CI
        if: steps.release_scope.outputs.should_publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ds-controller-pc-app
          path: package/pc
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download NDS ROM artifact from CI
        if: steps.release_scope.outputs.should_publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ds-controller-nds
          path: package/nds
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download Ubuntu app artifact from CI
        if: steps.release_scope.outputs.should_publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ds-controller-linux-deb
          path: package/linux
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create platform release zips
        if: steps.release_scope.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p \
            bundle/ds-controller-windows \
            bundle/ds-controller-ubuntu \
            dist

          cp package/pc/ds-controller.exe package/pc/WebView2Loader.dll \
            package/nds/ds-controller.nds package/nds/ds-controller.ini \
            bundle/ds-controller-windows/
          cp package/linux/ds-controller-linux-amd64.deb \
            package/nds/ds-controller.nds package/nds/ds-controller.ini \
            bundle/ds-controller-ubuntu/

          (cd bundle && zip -r -D "../dist/ds-controller-windows-${VERSION}.zip" ds-controller-windows)
          (cd bundle && zip -r -D "../dist/ds-controller-ubuntu-${VERSION}.zip" ds-controller-ubuntu)

      - name: Verify release zip contents
        if: steps.release_scope.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zipinfo -1 "dist/ds-controller-windows-${VERSION}.zip" | LC_ALL=C sort > actual-windows.txt
          cat > expected-windows.txt <<'EOF'
          ds-controller-windows/WebView2Loader.dll
          ds-controller-windows/ds-controller.exe
          ds-controller-windows/ds-controller.ini
          ds-controller-windows/ds-controller.nds
          EOF
          diff -u expected-windows.txt actual-windows.txt

          zipinfo -1 "dist/ds-controller-ubuntu-${VERSION}.zip" | LC_ALL=C sort > actual-ubuntu.txt
          cat > expected-ubuntu.txt <<'EOF'
          ds-controller-ubuntu/ds-controller-linux-amd64.deb
          ds-controller-ubuntu/ds-controller.ini
          ds-controller-ubuntu/ds-controller.nds
          EOF
          diff -u expected-ubuntu.txt actual-ubuntu.txt

          unzip -p "dist/ds-controller-ubuntu-${VERSION}.zip" \
            ds-controller-ubuntu/ds-controller-linux-amd64.deb > embedded.deb
          cmp package/linux/ds-controller-linux-amd64.deb embedded.deb

      - name: Generate release checksums
        if: steps.release_scope.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          sha256sum \
            "ds-controller-windows-${VERSION}.zip" \
            "ds-controller-ubuntu-${VERSION}.zip" \
            > SHA256SUMS

      - name: Generate release notes
        if: steps.release_scope.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIOUS_TAG: ${{ steps.release_scope.outputs.previous_tag }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            commit_range="${PREVIOUS_TAG}..${TARGET_SHA}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${VERSION}"
          else
            commit_range="$TARGET_SHA"
            compare_url=""
          fi

          commit_lines="$(git log --reverse --pretty=format:'- %s (%h)' "$commit_range")"

          {
            printf '## Changes\n\n'

            if [ -n "$commit_lines" ]; then
              printf '%s\n' "$commit_lines"
            else
              printf -- '- No commit changes detected.\n'
            fi

            printf '\n## Artifacts\n\n'
            printf -- "- Windows bundle: \`ds-controller-windows-${VERSION}.zip\`\n"
            printf -- "- Ubuntu bundle: \`ds-controller-ubuntu-${VERSION}.zip\`\n"
            printf -- '- Both bundles include the Nintendo DS ROM and config example.\n'
            printf -- '- The Ubuntu bundle contains the installable `ds-controller-linux-amd64.deb`.\n'
            printf -- "- Checksums: \`SHA256SUMS\`\n"

            printf '\n## Packaging change\n\n'
            printf -- '- New releases use separate Windows and Ubuntu ZIPs.\n'
            printf -- '- The previous generic ZIP and direct `.deb` asset are no longer published.\n'
            printf -- '- Older releases and their existing assets remain unchanged.\n'

            printf '\n## Verification\n\n'
            printf -- "- \`make test\`\n"
            printf -- "- \`make pc\`\n"
            printf -- "- \`make linux-verify\`\n"
            printf -- "- \`make nds\`\n"

            printf '\n## Full changelog\n\n'

            if [ -n "$compare_url" ]; then
              printf '%s\n' "$compare_url"
            else
              printf 'Initial release from %s.\n' "$TARGET_SHA"
            fi
          } > release-notes.md

      - name: Publish release
        if: steps.release_scope.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          current_main="$(git rev-parse FETCH_HEAD)"

          if [ "$current_main" != "$TARGET_SHA" ]; then
            printf 'Refusing to publish %s because origin/main is now %s.\n' "$TARGET_SHA" "$current_main" >&2
            exit 1
          fi

          gh release create "$VERSION" dist/* \
            --target "$TARGET_SHA" \
            --title "ds-controller ${VERSION}" \
            --notes-file release-notes.md \
            --latest
